name: APIsec Security Scan

# RFP.2.1 — Triggered on every pull request targeting develop or main.
on:
  pull_request:
    branches: [develop, main, master]
  workflow_dispatch:

jobs:
  apisec-security-gate:
    name: APIsec Security Gate
    # RFP.2.1 — Ephemeral GitHub-hosted runner; destroyed after each run.
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────────────────
      # RFP.2.1 — Credential handling:
      #   APISEC_TOKEN   → GitHub repository Secret (masked in all logs; blocked
      #                    from fork PRs by default)
      #   APISEC_AUTH_ID → GitHub repository Variable (non-sensitive config)
      #   Credentials are injected via environment variables only — never
      #   written to disk or passed as command-line arguments.
      #
      # RFP.2.2 — Severity gate: BLOCKING on Critical and High
      #   APISEC_MAX_CRITICAL: "0" → any Critical exits non-zero → PR blocked
      #   APISEC_MAX_HIGH:     "0" → any High exits non-zero     → PR blocked
      # ─────────────────────────────────────────────────────────────────────────
      - name: "Security Gate — Block on Critical & High"
        id: gate
        env:
          APISEC_TOKEN:        ${{ secrets.APISEC_TOKEN }}
          APISEC_HOST:         https://api.apisecapps.com
          APISEC_APP_ID:       019e8da0-0070-79ce-82f2-6cf6b832fc6d
          APISEC_INSTANCE_ID:  019e8da0-51d3-701e-a4fc-ece0eac25d80
          APISEC_AUTH_ID:      ${{ vars.APISEC_AUTH_ID }}
          APISEC_MAX_CRITICAL: "0"
          APISEC_MAX_HIGH:     "0"
          IMAGE: docker.io/apisec/apisec-scan-and-gate:latest
        run: |
          docker run --rm \
            -e APISEC_TOKEN \
            -e APISEC_HOST \
            -e APISEC_APP_ID \
            -e APISEC_INSTANCE_ID \
            -e APISEC_AUTH_ID \
            -e APISEC_MAX_CRITICAL \
            -e APISEC_MAX_HIGH \
            "$IMAGE" > /tmp/apisec-output.txt 2>&1
          EXIT_CODE=$?
          cat /tmp/apisec-output.txt
          exit $EXIT_CODE

      - name: Extract scan ID from container output
        id: scan-id
        if: always()
        run: |
          # Pull any UUID from the output that isn't the known app/instance IDs
          SCAN_ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' \
            /tmp/apisec-output.txt 2>/dev/null \
            | grep -v '019e8da0-0070-79ce-82f2-6cf6b832fc6d' \
            | grep -v '019e8da0-51d3-701e-a4fc-ece0eac25d80' \
            | head -1 || echo "")
          echo "scan_id=${SCAN_ID}" >> "$GITHUB_OUTPUT"

      - name: Post scan summary to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const blocked = '${{ steps.gate.outcome }}' !== 'success';
            const scanId  = '${{ steps.scan-id.outputs.scan_id }}';
            const scanUrl = scanId
              ? `https://itau.apisecapps.com/application/019e8da0-0070-79ce-82f2-6cf6b832fc6d/instance/019e8da0-51d3-701e-a4fc-ece0eac25d80/scans/${scanId}`
              : `https://itau.apisecapps.com/application/019e8da0-0070-79ce-82f2-6cf6b832fc6d/instance/019e8da0-51d3-701e-a4fc-ece0eac25d80/scans`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body: [
                '## APIsec API Security Scan',
                '',
                '| Severity Gate | Result |',
                '|---|---|',
                `| 🔴 Critical / High (blocking) | ${blocked ? '❌ **BLOCKED** — resolve findings before merging' : '✅ Passed — no Critical or High findings'} |`,
                '',
                `[**View scan results in APIsec →**](${scanUrl})`,
                '',
                blocked
                  ? '> **This PR is blocked from merging.** Resolve all Critical and High severity findings and re-run the scan.'
                  : '> Scan complete. No Critical or High findings detected.',
              ].join('\n'),
            });
