name: APIsec Security Scan

# RFP.2.1 — Triggered on every pull request targeting develop or main.
on:
  pull_request:
    branches: [develop, main, master]
  workflow_dispatch:

jobs:
  apisec-security-gate:
    name: APIsec Security Gate
    # RFP.2.1 — Ephemeral GitHub-hosted runner; destroyed after each run.
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────────────────
      # RFP.2.1 — Credential handling:
      #   APISEC_TOKEN  → GitHub repository Secret (masked in all logs; blocked
      #                   from fork PRs by default)
      #   APISEC_AUTH_ID → GitHub repository Variable (non-sensitive config)
      #   Credentials are injected via environment variables only — never
      #   written to disk or passed as command-line arguments.
      # ─────────────────────────────────────────────────────────────────────────

      # ─────────────────────────────────────────────────────────────────────────
      # RFP.2.2 — Severity gate: BLOCKING on Critical and High
      #
      # APISEC_MAX_CRITICAL: "0" → any Critical exits non-zero → PR blocked
      # APISEC_MAX_HIGH:     "0" → any High exits non-zero     → PR blocked
      # ─────────────────────────────────────────────────────────────────────────
      - name: "Security Gate — Block on Critical & High"
        id: gate-high
        env:
          APISEC_TOKEN:        ${{ secrets.APISEC_TOKEN }}
          APISEC_HOST:         https://api.apisecapps.com
          APISEC_APP_ID:       019e8da0-0070-79ce-82f2-6cf6b832fc6d
          APISEC_INSTANCE_ID:  019e8da0-51d3-701e-a4fc-ece0eac25d80
          APISEC_AUTH_ID:      ${{ vars.APISEC_AUTH_ID }}
          APISEC_MAX_CRITICAL: "0"   # Block on any Critical
          APISEC_MAX_HIGH:     "0"   # Block on any High
          IMAGE: docker.io/apisec/apisec-scan-and-gate:latest
        run: |
          docker run --rm \
            -e APISEC_TOKEN \
            -e APISEC_HOST \
            -e APISEC_APP_ID \
            -e APISEC_INSTANCE_ID \
            -e APISEC_AUTH_ID \
            -e APISEC_MAX_CRITICAL \
            -e APISEC_MAX_HIGH \
            "$IMAGE"

      # ─────────────────────────────────────────────────────────────────────────
      # RFP.2.2 — Severity advisory: WARNING on Medium
      #
      # continue-on-error: true → step failure does not block the PR.
      # if: always()            → runs even when the High gate above has failed,
      #                           so both gates are always visible on the PR.
      # ─────────────────────────────────────────────────────────────────────────
      - name: "Security Advisory — Warn on Medium"
        id: advisory-medium
        if: always()
        continue-on-error: true
        env:
          APISEC_TOKEN:        ${{ secrets.APISEC_TOKEN }}
          APISEC_HOST:         https://api.apisecapps.com
          APISEC_APP_ID:       019e8da0-0070-79ce-82f2-6cf6b832fc6d
          APISEC_INSTANCE_ID:  019e8da0-51d3-701e-a4fc-ece0eac25d80
          APISEC_AUTH_ID:      ${{ vars.APISEC_AUTH_ID }}
          APISEC_MAX_CRITICAL: "999"  # Not gating on Critical/High in this step
          APISEC_MAX_HIGH:     "999"
          APISEC_MAX_MEDIUM:   "0"    # Advisory: warn if any Medium found
          IMAGE: docker.io/apisec/apisec-scan-and-gate:latest
        run: |
          docker run --rm \
            -e APISEC_TOKEN \
            -e APISEC_HOST \
            -e APISEC_APP_ID \
            -e APISEC_INSTANCE_ID \
            -e APISEC_AUTH_ID \
            -e APISEC_MAX_CRITICAL \
            -e APISEC_MAX_HIGH \
            -e APISEC_MAX_MEDIUM \
            "$IMAGE"

      - name: Post scan summary to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const highBlocked   = '${{ steps.gate-high.outcome }}'       !== 'success';
            const mediumWarning = '${{ steps.advisory-medium.outcome }}' !== 'success';

            const body = [
              '## APIsec API Security Scan',
              '',
              '| Severity     | Gate type | Result |',
              '|---|---|---|',
              `| 🔴 Critical / High | Blocking  | ${highBlocked   ? '❌ **BLOCKED** — resolve before merge' : '✅ Passed'} |`,
              `| 🟡 Medium          | Advisory  | ${mediumWarning ? '⚠️ Findings detected — review recommended' : '✅ No findings'} |`,
              '',
              highBlocked
                ? '> **This PR is blocked from merging.** Resolve all Critical and High severity findings and re-run the scan.'
                : '> Scan complete. No blocking findings detected.',
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body,
            });
