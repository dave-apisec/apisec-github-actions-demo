name: APIsec Security Scan

# RFP.2.1 — Triggered on every pull request targeting develop or main.
on:
  pull_request:
    branches: [develop, main, master]
  workflow_dispatch:

jobs:
  apisec-security-gate:
    name: APIsec Security Gate
    # RFP.2.1 — Ephemeral GitHub-hosted runner; destroyed after each run.
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────────────────
      # DEMO BRANCH: demo/scan-pass
      # Thresholds set high so the scan runs and reports findings,
      # but the pipeline does NOT block — the PR check passes.
      #
      # RFP.2.1 — Credential handling:
      #   APISEC_TOKEN  → GitHub repository Secret (masked in logs)
      #   APISEC_AUTH_ID → GitHub repository Variable (non-sensitive)
      # ─────────────────────────────────────────────────────────────────────────
      - name: "APIsec Scan — Advisory only (no severity gate)"
        id: scan
        env:
          APISEC_TOKEN:        ${{ secrets.APISEC_TOKEN }}
          APISEC_HOST:         https://api.apisecapps.com
          APISEC_APP_ID:       019e8da0-0070-79ce-82f2-6cf6b832fc6d
          APISEC_INSTANCE_ID:  019e8da0-51d3-701e-a4fc-ece0eac25d80
          APISEC_AUTH_ID:      ${{ vars.APISEC_AUTH_ID }}
          APISEC_MAX_CRITICAL: "999"  # High threshold — scan runs, nothing blocks
          APISEC_MAX_HIGH:     "999"
          IMAGE: docker.io/apisec/apisec-scan-and-gate:latest
        run: |
          docker run --rm \
            -e APISEC_TOKEN \
            -e APISEC_HOST \
            -e APISEC_APP_ID \
            -e APISEC_INSTANCE_ID \
            -e APISEC_AUTH_ID \
            -e APISEC_MAX_CRITICAL \
            -e APISEC_MAX_HIGH \
            "$IMAGE"

      - name: Post scan summary to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.scan.outcome }}' === 'success';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body: [
                '## APIsec API Security Scan',
                '',
                '| Severity Gate | Result |',
                '|---|---|',
                `| No severity gate (advisory only) | ${passed ? '✅ Scan complete — findings reported to APIsec dashboard' : '⚠️ Scan encountered an error'} |`,
                '',
                '> This branch runs APIsec in advisory mode. Findings are visible in the APIsec dashboard but do not block this PR.',
              ].join('\n'),
            });
